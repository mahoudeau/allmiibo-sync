<script>
// First paint honours the stored preferences (header.js manages them after).
try{const d=document.documentElement;d.dataset.mode=localStorage.getItem('allmiibo:mode')==='advanced'?'advanced':'default';const t=localStorage.getItem('allmiibo:theme');d.dataset.theme=['a','b','c'].includes(t)?t:'c';}catch{}
</script>
<style>
  .helpSec { border:2px solid var(--border); background:var(--panel);
             box-shadow:4px 4px 0 var(--shadow); padding:1rem 1.2rem; margin-bottom:1.2rem; }
  .helpSec h2 { display:flex; align-items:center; gap:.55rem; color:var(--fg);
                font-size:.65rem; margin-bottom:.7rem; }
  .helpSec ul { margin:.4rem 0 .4rem 1.2rem; padding:0; font-size:.92rem; }
  .helpSec li { margin:.35rem 0; }
  .helpSec b { color:var(--fg); }
  .helpSec code { font-family:var(--mono); font-size:.8rem; }
  .helpSec a { color:var(--fg); }
  .muted { color:var(--muted); }

  /* One release is one panel. The title sits under the version, so scanning
     down the left edge gives you the numbers and nothing else.
     Four levels of pixel type in one panel, each clearly a step down from the
     one above: version, title, category, group. */
  .helpSec h2 { font-size:.8rem; margin-bottom:.5rem; }
  .clTitle { font-family:var(--pixel); font-size:.72rem; line-height:1.5;
             color:var(--accent); margin:0 0 1.4rem; }
  .clCat { display:flex; align-items:center; gap:.5rem; font-family:var(--pixel);
           font-size:.62rem; line-height:1.5; color:var(--fg); margin:1.6rem 0 .5rem;
           text-transform:uppercase; }
  .clCat svg { width:1.1rem; height:1.1rem; }
  .helpSec h3 { font-family:var(--pixel); font-size:.52rem; line-height:1.5;
                color:var(--muted); margin:1.1rem 0 .3rem; }

  /* The index. Scrolls inside itself rather than widening the page, the same
     way the example paths on the HOW TO page do. */
  .clIndexWrap { overflow-x:auto; margin:0 0 1.6rem; }
  .clIndex { width:100%; border-collapse:collapse; font-size:.9rem;
             white-space:nowrap; }
  .clIndex th { text-align:left; font-family:var(--pixel); font-size:.5rem;
                color:var(--muted); text-transform:uppercase; font-weight:normal;
                border-bottom:2px solid var(--border);
                padding:0 1.1rem .45rem 0; }
  .clIndex td { border-bottom:1px solid var(--border); padding:.5rem 1.1rem .5rem 0; }
  .clIndex tr:last-child td { border-bottom:0; }
  .clIndex a { font-family:var(--pixel); font-size:.55rem; color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>What's new</h1>
  <p class="sub">Every release, newest first.</p>

  <div id="clBody"></div>

  <p class="sub muted">The same history, in the repository:
    <a href="https://github.com/mahoudeau/allmiibo-sync/blob/main/CHANGELOG.md"
       target="_blank" rel="noreferrer noopener">CHANGELOG.md</a>.</p>
</main>
<script type="module" src="./js/header.js"></script>
<script type="module" src="./js/changelogui.js"></script>
<script type="module" src="./js/footer.js"></script>
</body>
</html>
