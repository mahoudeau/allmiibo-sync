<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>amiibo</title>
<link rel="stylesheet" href="./css/app.css">
<style>
  .detail { display: grid; gap: 1.5rem; grid-template-columns: 1fr; margin-top: 1rem; }
  @media (min-width: 700px) { .detail { grid-template-columns: minmax(16rem, 22rem) 1fr; } }

  .portrait { border: 1px solid var(--border); border-radius: 10px; background: var(--panel);
              display: flex; align-items: center; justify-content: center;
              min-height: 20rem; padding: 1.5rem; position: relative; }
  .portrait img { max-width: 100%; max-height: 26rem; object-fit: contain; }
  .portrait .noArt { color: var(--muted); font-size: 3rem; font-weight: 700; }

  .facts h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
  .facts .series { color: var(--muted); margin-bottom: 1.25rem; }
  .factGrid { display: grid; grid-template-columns: auto 1fr; gap: .45rem 1.25rem; font-size: .92rem; }
  .factGrid dt { color: var(--muted); }
  .factGrid dd { margin: 0; font-variant-numeric: tabular-nums; }
  .badges { display: flex; gap: .4rem; margin: .75rem 0 1rem; flex-wrap: wrap; }
  .idmono { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--panel);
            border: 1px solid var(--border); border-radius: 5px; padding: .15rem .45rem; }
  .vehiclesBlock { margin-top: 1.25rem; }
  .vehiclesBlock h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
                      color: var(--muted); margin: 0 0 .5rem; }
  .tag { font-size: .72rem; padding: .1rem .45rem; border-radius: 4px;
         border: 1px solid var(--border); color: var(--muted); }
  .tag.ok-tag { border-color: var(--ok); color: var(--ok); }
  .tag.dev { border-color: var(--accent); color: var(--accent); }
  .tag.new { border-color: var(--warn); color: var(--warn); }
  .vehicles { display: flex; flex-wrap: wrap; gap: .35rem; }
  .chip { font-size: .75rem; padding: .12rem .5rem; border-radius: 99px;
          border: 1px dashed var(--border); color: var(--muted); opacity: .6; }
  .chip.have { border-style: solid; border-color: var(--ok); color: var(--ok); opacity: 1; }
</style>
</head>
<body>
<main>
  <nav><a href="./collection.html">← collection</a></nav>

  <div id="content" class="detail">
    <div class="status">Loading…</div>
  </div>
</main>
<script type="module" src="./js/amiibodetail.js"></script>
<script type="module" src="./js/footer.js"></script>
</body>
</html>
