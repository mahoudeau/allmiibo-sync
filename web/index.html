<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>allmiibo-sync</title>
<meta name="description" content="Sync your amiibo collection over Bluetooth — browse the database, track what you own, keep your device in sync. Runs entirely in the browser.">
<meta name="theme-color" content="#2b2b2a">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:site_name" content="allmiibo-sync">
<meta property="og:title" content="allmiibo-sync">
<meta property="og:description" content="Sync your amiibo collection over Bluetooth — browse the database, track what you own, keep your device in sync. Runs entirely in the browser.">
<meta property="og:url" content="https://allmiibo.mathieu.dev/">
<meta property="og:image" content="https://allmiibo.mathieu.dev/icons/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="./css/app.css">
<script>
// First paint honours the stored preferences (header.js manages them after).
try{const d=document.documentElement;d.dataset.mode=localStorage.getItem('allmiibo:mode')==='advanced'?'advanced':'default';const t=localStorage.getItem('allmiibo:theme');d.dataset.theme=['a','b','c'].includes(t)?t:'c';}catch{}
</script>
<style>
  /* NES title screen. */
  .title {
    position: relative; overflow: hidden; text-align: center;
    padding: 3.5rem 1rem 3rem; margin-top: .5rem;
    border: 2px solid var(--border); background: var(--panel);
    box-shadow: 5px 5px 0 var(--shadow);
    /* Fill the first screen: viewport minus body padding, header and margins.
       The note and footer live below the fold. */
    min-height: calc(100dvh - 8rem);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
  }
  .title .logoBig { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; margin-bottom: 1rem; }
  .title .wm { font-family: var(--pixel); font-size: clamp(.9rem, 4vw, 1.4rem); color: #fff; }
  .title .wm .sfx { color: var(--err); }
  .title .tagline { font-family: var(--pixel); font-size: .55rem; color: var(--muted);
    margin-bottom: 2rem; letter-spacing: .05em; }
  .start { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
  a.startBtn {
    font-family: var(--pixel); font-size: .65rem; color: var(--fg); text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
    padding: .9em 1.2em; border: 2px solid var(--border);
    background: var(--panel2); box-shadow: 3px 3px 0 var(--shadow);
  }
  a.startBtn:hover { border-color: var(--accent); }
  a.startBtn:active { transform: translate(3px, 3px); box-shadow: none; }
  a.startBtn.primary { background: var(--accent); border-color: var(--shadow); color: #fff; }
  .press { font-family: var(--pixel); font-size: .55rem; color: var(--err); margin-top: 2.2rem;
    display: inline-flex; align-items: center; gap: .35rem; text-decoration: none; }
  .startBtn .ico, .press .ico { width: 1.05rem; height: 1.05rem; margin: -.4rem 0; flex: none; }
  .press .ico { width: .85rem; height: .85rem; }
  .title { cursor: pointer; }
  .badPill { font-family: var(--pixel); font-size: .5rem; color: var(--warn);
    border: 2px solid var(--warn); padding: .35rem .6rem; margin-bottom: 1.4rem;
    display: inline-block; }
  .homeNote { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 1.2rem; }
  @media (prefers-reduced-motion: no-preference) {
    .press { animation: blink 1.1s steps(1) infinite; }
  }
  @keyframes blink { 50% { opacity: 0; } }
  .scan { position: absolute; inset: 0; pointer-events: none; opacity: .28;
    background: repeating-linear-gradient(to bottom, #0000 0 2px, #0005 2px 4px); }
  .homeNotes { margin-top: 1.5rem; }
</style>
</head>
<body>
<main>
  <div class="title" id="title">
    <div class="scan"></div>
    <div class="logoBig">
      <span data-pirate-mark="120"></span>
      <span class="wm">ALLMIIBO<span class="sfx">-SYNC</span></span>
    </div>
    <div class="tagline">SYNC YOUR AMIIBO COLLECTION OVER BLUETOOTH</div>
    <span class="badPill" id="badPill" hidden>NEEDS CHROME OR EDGE FOR SYNC</span>
    <div class="start">
      <a class="startBtn primary" href="./collection.html"><span class="ico" data-ico="play"></span>START</a>
    </div>
    <a class="press" href="./collection.html"><span class="ico" data-ico="chevronRight"></span>PRESS START</a>
  </div>

  <p class="homeNote">Runs in your browser. Your files stay on your machine.</p>
</main>
<script type="module" src="./js/footer.js"></script>
<script type="module">
// No header on the title screen, so draw the mascot (in the stored colourway)
// ourselves.
import { pirateMark, FINISHES, DEFAULT_FINISH } from './js/sprite.js';
import { ICONS } from './js/icons.js';
for (const el of document.querySelectorAll('[data-ico]')) el.innerHTML = ICONS[el.dataset.ico] ?? '';
let finish = DEFAULT_FINISH;
try {
  const i = Number(localStorage.getItem('allmiibo:pirate'));
  if (Number.isInteger(i) && i >= 0 && i < FINISHES.length) finish = i;
} catch {}
for (const el of document.querySelectorAll('[data-pirate-mark]')) {
  el.innerHTML = pirateMark(Number(el.dataset.pirateMark), finish);
}

// The whole title panel is the start action; ENTER and SPACE work too.
document.getElementById('title').addEventListener('click', (e) => {
  if (e.target.closest('a')) return; // real links handle themselves
  location.href = './collection.html';
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest('a, button, input, select, textarea')) return;
  e.preventDefault();
  location.href = './collection.html';
});

// Detection, not education: one pill when sync can't work here.
if (!('bluetooth' in navigator) || !('showDirectoryPicker' in window)) {
  document.getElementById('badPill').hidden = false;
}
</script>
</body>
</html>
