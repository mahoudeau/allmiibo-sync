<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>allmiibo-sync — device probe</title>
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<main>
  <h1>allmiibo-sync — device probe</h1>
  <p class="sub">Read-only. Issues no writes, creates nothing, deletes nothing.</p>

  <nav><a href="./write-test.html">write test →</a></nav>

  <div class="note">
    Requires Chrome or Edge, served over <code>http://localhost</code>.
    Close any other tab connected to the device first — it accepts one connection at a time.
  </div>

  <div class="row" style="margin-top:1rem">
    <button id="connect" class="primary">Connect</button>
    <button id="disconnect" disabled>Disconnect</button>
    <button id="probe" disabled>Run probe</button>
    <label>Max depth <input id="maxDepth" type="number" min="1" max="12" value="4"></label>
    <label><input id="readSample" type="checkbox" checked> Read one file back</label>
  </div>

  <div id="status" class="status">Ready</div>

  <section>
    <h2>Filesystem</h2>
    <pre id="tree">(not yet probed)</pre>
  </section>

  <section>
    <h2>Log</h2>
    <div id="log" class="logbox"></div>
  </section>

  <div class="row">
    <button id="copy" disabled>Copy report</button>
    <button id="save" disabled>Save report JSON</button>
  </div>
</main>
<script type="module" src="./js/probe.js"></script>
</body>
</html>
